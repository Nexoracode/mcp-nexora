[project]
name = "nexora"
version = "0.1.0"
description = "MCP server for managing a MySQL/MariaDB database from ChatGPT"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.9,<2",
    "aiomysql>=0.2",
    "sqlglot>=25",
    "pydantic-settings>=2.3",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexora"]

[tool.pytest.ini_options]
pythonpath = ["src"]
